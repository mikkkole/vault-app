<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1A1040, #2D1B69, #4A3590);
            color: white;
        }
        .card {
            text-align: center;
            padding: 48px 32px;
            max-width: 360px;
            width: 90%;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #A29BFE);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .tagline {
            font-size: 16px;
            opacity: 0.7;
            margin-bottom: 40px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 0.15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: white;
            color: #4A3590;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">Vault</div>
        <div class="tagline">Найди любую вещь за 10 секунд</div>
        <a href="app.html" class="btn btn-primary">Открыть веб-версию</a>
        <a href="vault.apk" download class="btn btn-secondary">Скачать для Android</a>
    </div>
</body>
</html>
